name: Test sort-by input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          matrix: |
            [
              {"name": "gamma", "env": "prod"},
              {"name": "alpha", "env": "dev"},
              {"name": "beta", "env": "staging"}
            ]
          sort-by: .name
      - name: Assert matrix output is valid JSON with include
        env:
          ACTUAL: ${{ steps.action.outputs.matrix }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: matrix output is empty"
            exit 1
          fi
          if ! echo "$ACTUAL" | jq . > /dev/null 2>&1; then
            echo "FAIL: matrix output is not valid JSON"
            exit 1
          fi
          if ! echo "$ACTUAL" | jq -e '.include' > /dev/null 2>&1; then
            echo "FAIL: matrix output does not contain 'include' key"
            exit 1
          fi
          echo "PASS: matrix output is valid JSON with include"
      - name: Assert items are sorted by name
        env:
          ACTUAL: ${{ steps.action.outputs.matrix }}
        run: |
          echo "actual: $ACTUAL"
          FIRST=$(echo "$ACTUAL" | jq -r '.include[0].name')
          SECOND=$(echo "$ACTUAL" | jq -r '.include[1].name')
          THIRD=$(echo "$ACTUAL" | jq -r '.include[2].name')
          echo "first: $FIRST, second: $SECOND, third: $THIRD"
          if [ "$FIRST" != "alpha" ] || [ "$SECOND" != "beta" ] || [ "$THIRD" != "gamma" ]; then
            echo "FAIL: items not sorted correctly. Expected alpha, beta, gamma"
            exit 1
          fi
          echo "PASS: items are sorted by name"
