name: Test object input format with include key
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          matrix: |
            {
              "include": [
                {"name": "one", "env": "dev"},
                {"name": "two", "env": "staging"},
                {"name": "three", "env": "prod"}
              ]
            }
          sort-by: .name
      - name: Assert output is non-empty and valid JSON
        env:
          ACTUAL: ${{ steps.action.outputs.matrix }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: matrix output is empty"
            exit 1
          fi
          echo "$ACTUAL" | jq . > /dev/null || { echo "FAIL: not valid JSON"; exit 1; }
          echo "PASS: valid JSON"
      - name: Assert output has include key with 3 items
        env:
          ACTUAL: ${{ steps.action.outputs.matrix }}
        run: |
          echo "actual: $ACTUAL"
          COUNT=$(echo "$ACTUAL" | jq '.include | length')
          echo "include count: $COUNT"
          if [ "$COUNT" != "3" ]; then
            echo "FAIL: expected 3 items in include, got $COUNT"
            exit 1
          fi
          echo "PASS: 3 items present"
      - name: Assert items are sorted by name
        env:
          ACTUAL: ${{ steps.action.outputs.matrix }}
        run: |
          echo "actual: $ACTUAL"
          FIRST=$(echo "$ACTUAL" | jq -r '.include[0].name')
          echo "first item name: $FIRST"
          if [ "$FIRST" != "one" ]; then
            echo "FAIL: expected first item to be 'one', got '$FIRST'"
            exit 1
          fi
          echo "PASS: items sorted correctly"
