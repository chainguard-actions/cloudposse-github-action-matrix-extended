name: Test object input with include property
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          matrix: '{"include":[{"name":"foo","region":"us-east-1"},{"name":"bar","region":"eu-west-1"}]}'
          sort-by: .name
          nested-matrices-count: "1"

      - name: Assert matrix output is non-empty
        env:
          ACTUAL: ${{ steps.action.outputs.matrix }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: matrix output is empty"
            exit 1
          fi
          echo "PASS: matrix output is non-empty"

      - name: Assert matrix output contains include key
        env:
          ACTUAL: ${{ steps.action.outputs.matrix }}
        run: |
          echo "actual: $ACTUAL"
          echo "$ACTUAL" | grep -q '"include"' || { echo "FAIL: missing 'include' key in output"; exit 1; }
          echo "PASS: 'include' key found"

      - name: Assert matrix output contains expected items
        env:
          ACTUAL: ${{ steps.action.outputs.matrix }}
        run: |
          echo "actual: $ACTUAL"
          echo "$ACTUAL" | grep -q '"foo"' || { echo "FAIL: missing 'foo' in output"; exit 1; }
          echo "$ACTUAL" | grep -q '"bar"' || { echo "FAIL: missing 'bar' in output"; exit 1; }
          echo "PASS: expected items found"

      - name: Assert items are sorted by name
        env:
          ACTUAL: ${{ steps.action.outputs.matrix }}
        run: |
          echo "actual: $ACTUAL"
          # After sort_by(.name), "bar" should appear before "foo"
          FOO_POS=$(echo "$ACTUAL" | grep -bo '"foo"' | head -1 | cut -d: -f1)
          BAR_POS=$(echo "$ACTUAL" | grep -bo '"bar"' | head -1 | cut -d: -f1)
          echo "bar position: $BAR_POS, foo position: $FOO_POS"
          if [ -n "$BAR_POS" ] && [ -n "$FOO_POS" ] && [ "$BAR_POS" -lt "$FOO_POS" ]; then
            echo "PASS: items are sorted (bar before foo)"
          else
            echo "FAIL: items are not sorted correctly (expected bar before foo)"
            exit 1
          fi
