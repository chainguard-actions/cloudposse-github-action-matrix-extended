name: Test file path as matrix input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create matrix JSON file
        run: |
          cat > /tmp/matrix-input.json << 'EOF'
          [
            {"name": "service-a", "region": "us-east-1"},
            {"name": "service-b", "region": "us-west-2"},
            {"name": "service-c", "region": "eu-west-1"}
          ]
          EOF
          echo "Matrix file created at /tmp/matrix-input.json"
          cat /tmp/matrix-input.json
      - id: action
        uses: .
        with:
          matrix: /tmp/matrix-input.json
          sort-by: .name
      - name: Assert output is non-empty and valid JSON
        env:
          ACTUAL: ${{ steps.action.outputs.matrix }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: matrix output is empty"
            exit 1
          fi
          echo "$ACTUAL" | jq . > /dev/null || { echo "FAIL: not valid JSON"; exit 1; }
          echo "PASS: valid JSON"
      - name: Assert output has include key with 3 items
        env:
          ACTUAL: ${{ steps.action.outputs.matrix }}
        run: |
          echo "actual: $ACTUAL"
          COUNT=$(echo "$ACTUAL" | jq '.include | length')
          echo "include count: $COUNT"
          if [ "$COUNT" != "3" ]; then
            echo "FAIL: expected 3 items in include, got $COUNT"
            exit 1
          fi
          echo "PASS: 3 items present from file input"
      - name: Assert items are sorted by name
        env:
          ACTUAL: ${{ steps.action.outputs.matrix }}
        run: |
          echo "actual: $ACTUAL"
          FIRST=$(echo "$ACTUAL" | jq -r '.include[0].name')
          echo "first item name: $FIRST"
          if [ "$FIRST" != "service-a" ]; then
            echo "FAIL: expected first item to be 'service-a', got '$FIRST'"
            exit 1
          fi
          echo "PASS: file path input works and items are sorted"
