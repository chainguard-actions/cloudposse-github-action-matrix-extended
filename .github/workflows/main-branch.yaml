name: Main branch
on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  perform:
    uses: cloudposse/github-actions-workflows-github-action-composite/.github/workflows/main-branch.yml@a4d0078b26faab74b046f3104f39a40f5436aa92 # main
    with:
      organization: "${{ github.event.repository.owner.login }}"
      repository: "${{ github.event.repository.name }}"
    secrets:
      github-private-actions-pat: "${{ secrets.PUBLIC_REPO_ACCESS_TOKEN }}"
