name: Feature branch

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]

jobs:
  perform:
    uses: cloudposse/github-actions-workflows-github-action-composite/.github/workflows/feature-branch.yml@a4d0078b26faab74b046f3104f39a40f5436aa92 # main
    with:
      organization: "${{ github.event.repository.owner.login }}"
      repository: "${{ github.event.repository.name }}"
      ref: "${{ github.event.pull_request.head.ref  }}"
    secrets:
      github-private-actions-pat: "${{ secrets.PUBLIC_REPO_ACCESS_TOKEN }}"